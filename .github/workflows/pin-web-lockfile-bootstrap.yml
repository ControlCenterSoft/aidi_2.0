name: Bootstrap pinned web lockfile

on:
  push:
    branches:
      - automation/issue-3-pin-web-lockfile-v4

permissions:
  actions: read
  contents: write

jobs:
  pin-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/issue-3-pin-web-lockfile-v4
          fetch-depth: 0
      - name: Download qualified lockfile artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/web-lockfile
          gh run download 36273719584 --repo "$GITHUB_REPOSITORY" --name web-lockfile --dir /tmp/web-lockfile
          test -f /tmp/web-lockfile/package-lock.json
          echo "5e0d9048ce0be89b80ea40d73471696522a3159ae766ff6a0b800802b9bce191  /tmp/web-lockfile/package-lock.json" | sha256sum -c -
      - name: Commit pinned lockfile and remove bootstrap workflow
        run: |
          set -euo pipefail
          cp /tmp/web-lockfile/package-lock.json web/package-lock.json
          git rm .github/workflows/pin-web-lockfile-bootstrap.yml
          git add web/package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(release-a): pin web dependency lockfile (#3)"
          git push origin HEAD:automation/issue-3-pin-web-lockfile-v4
