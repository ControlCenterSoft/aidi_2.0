name: Diagnose Copilot selector

on:
  push:
    branches:
      - automation/issue-19-copilot-selector

permissions:
  contents: read
  copilot-requests: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      COPILOT_VERSION: "1.0.88"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/issue-19-copilot-selector
          fetch-depth: 0
      - name: Install pinned Copilot CLI
        run: npm install -g "@github/copilot@$COPILOT_VERSION"
      - name: Show safe CLI metadata
        run: |
          set -euo pipefail
          copilot --version
          copilot --help | sed -n '1,220p'
      - name: Qualify normalized selector contract
        run: |
          set -euo pipefail
          cat > /tmp/selector-prompt.txt <<'PROMPT'
          Work only in this checked-out repository. Read docs/SPEC.md, docs/ROADMAP.md,
          docs/FOUNDATION.md and the current source tree. Select exactly one small,
          dependency-ready Release A Foundation slice that is not already implemented.
          Priority: core/domain contracts, canonical state, configuration, API boundaries,
          architecture primitives. Do not modify any file. Do not use external/local AIDI,
          Forgejo, VMs, runners, queues, databases or state.

          Return concise Markdown:
          include exactly one top-level "# <issue title>" heading;
          then Scope, Acceptance criteria, and Evidence expected.
          The slice must fit one PR and be independently testable.
          PROMPT

          set +e
          copilot -p "$(cat /tmp/selector-prompt.txt)" -s             --allow-tool='read,shell(git log:*),shell(git status),shell(grep:*),shell(find:*)'             --no-ask-user > /tmp/selector.raw.md 2> /tmp/selector.err
          status=$?
          set -e
          echo "exit_status=$status"
          if [[ "$status" -ne 0 ]]; then
            sed -n '1,220p' /tmp/selector.err >&2
            exit "$status"
          fi

          awk 'found || /^# / { found=1; print }' /tmp/selector.raw.md > /tmp/selector.md
          title="$(sed -n '1s/^# //p' /tmp/selector.md)"
          test -n "$title"
          echo "normalized_title=$title"
          echo "--- normalized plan ---"
          sed -n '1,220p' /tmp/selector.md
