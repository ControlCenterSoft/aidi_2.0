name: AIDI Autonomous Core

on:
  workflow_dispatch:
  push:
    branches:
      - automation-control
    paths:
      - '.automation/kicks/*.trigger'
  schedule:
    # Watchdog only. Normal healthy cycles chain themselves via workflow_dispatch.
    # Keep this intentionally low-frequency and away from the top of the hour.
    - cron: "8,38 * * * *"

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: aidi-autonomous-core
  cancel-in-progress: false

jobs:
  release-a-core:
    if: github.repository == 'ControlCenterSoft/aidi_2.0'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      LEASE_OWNER: "core-${{ github.run_id }}"

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Acquire GitHub scheduler lease
        id: lease
        shell: bash
        run: |
          set -euo pipefail

          lease_endpoint="repos/$REPO/contents/.automation/lease.active?ref=automation-control"
          now_epoch="$(date -u +%s)"

          active_previous_work() {
            local runs
            # An open PR is durable recoverable state, not proof that a process
            # still owns an expired lease. Retain a stale lease only while
            # another GitHub Actions run is actually queued/in_progress.
            runs="$(gh run list --repo "$REPO" --limit 100 \
              --json databaseId,status | \
              jq --argjson current "$GITHUB_RUN_ID" \
                '[.[] | select((.status == "queued" or .status == "in_progress") and .databaseId != $current)] | length')"
            test "$runs" -gt 0
          }

          # Existence of lease.active is the mutex. If it is stale and there is
          # no matching external work, remove it by exact blob SHA.
          if lease_json="$(gh api "$lease_endpoint" 2>/dev/null)"; then
            lease_sha="$(jq -r '.sha' <<<"$lease_json")"
            lease_content="$(jq -r '.content' <<<"$lease_json" | base64 -d)"
            lease_until="$(jq -r '.lease_until // empty' <<<"$lease_content")"

            if [[ -n "$lease_until" ]]; then
              lease_epoch="$(date -u -d "$lease_until" +%s)"
            else
              lease_epoch=0
            fi

            if (( lease_epoch > now_epoch )); then
              echo "acquired=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if active_previous_work; then
              echo "Expired lease retained because previous GitHub work is still active."
              echo "acquired=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            gh api --method DELETE "repos/$REPO/contents/.automation/lease.active" \
              -f message="chore(automation): remove stale lease" \
              -f sha="$lease_sha" \
              -f branch="automation-control" >/dev/null
          fi

          lease_content="$(jq -n \
            --arg owner "$LEASE_OWNER" \
            --arg started "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg until "$(date -u -d '+45 minutes' +%Y-%m-%dT%H:%M:%SZ)" \
            --arg role "AIDI Autonomous Core" \
            '{owner:$owner,started_at:$started,lease_until:$until,task_role:$role}')"
          encoded="$(printf '%s\n' "$lease_content" | base64 -w0)"

          if gh api --method PUT "repos/$REPO/contents/.automation/lease.active" \
            -f message="chore(automation): acquire $LEASE_OWNER lease" \
            -f content="$encoded" \
            -f branch="automation-control" >/dev/null 2>&1; then
            echo "acquired=true" >> "$GITHUB_OUTPUT"
          else
            # Normal create-file contention: another writer won the mutex.
            echo "acquired=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Recover one existing automation PR
        id: recover
        if: steps.lease.outputs.acquired == 'true'
        shell: bash
        run: |
          set -euo pipefail

          prs="$(gh pr list --repo "$REPO" --state open --limit 100 \
            --json number,headRefName | \
            jq '[.[] | select(.headRefName | (startswith("automation/") or startswith("chatgpt/")))]')"
          count="$(jq 'length' <<<"$prs")"

          if [[ "$count" -eq 0 ]]; then
            echo "recovered=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$count" -ne 1 ]]; then
            echo "Expected at most one open automation PR, found $count; refusing recovery." >&2
            echo "recovered=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pr="$(jq -r '.[0].number' <<<"$prs")"
          linked_issue="$(gh pr view "$pr" --repo "$REPO" --json body --jq '.body' | grep -oE 'Closes #[0-9]+' | head -n1 | grep -oE '[0-9]+' || true)"
          [[ -n "$linked_issue" ]] || {
            echo "Automation PR #$pr has no Closes #N linkage; refusing recovery." >&2
            echo "recovered=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          bot_issues="$(gh api --paginate "repos/$REPO/issues?state=open&sort=created&direction=asc&per_page=100" | \
            jq -s '[.[][] | select((has("pull_request") | not) and .user.login == "github-actions[bot]")] | sort_by(.created_at)')"
          oldest_issue="$(jq -r '.[0].number // empty' <<<"$bot_issues")"

          if [[ -n "$oldest_issue" && "$oldest_issue" != "$linked_issue" ]]; then
            echo "PR #$pr belongs to newer Issue #$linked_issue while older Issue #$oldest_issue is unresolved; superseding newer cycle."
            gh pr comment "$pr" --repo "$REPO" --body "Superseded by older unresolved automation Issue #$oldest_issue. This PR was not merged; queue order is being restored by the native executor."
            gh pr close "$pr" --repo "$REPO" --delete-branch
            linked_state="$(gh issue view "$linked_issue" --repo "$REPO" --json state --jq '.state')"
            if [[ "$linked_state" == "OPEN" ]]; then
              gh issue comment "$linked_issue" --repo "$REPO" --body "Closed as superseded because older automation Issue #$oldest_issue remains unresolved. No product merge was performed from the superseded PR."
              gh issue close "$linked_issue" --repo "$REPO" --reason "not planned"
            fi
            echo "recovered=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          head="$(gh pr view "$pr" --repo "$REPO" --json headRefName --jq '.headRefName')"
          sha="$(gh pr view "$pr" --repo "$REPO" --json headRefOid --jq '.headRefOid')"

          run_id="$(gh run list --repo "$REPO" --workflow ci.yml --branch "$head" --limit 20 \
            --json databaseId,headSha,status,conclusion,event | \
            jq -r --arg sha "$sha" '.[] | select(.headSha == $sha and .event == "workflow_dispatch") | .databaseId' | head -n1)"

          if [[ -z "$run_id" ]]; then
            gh workflow run ci.yml --repo "$REPO" --ref "$head"
            for _ in $(seq 1 30); do
              run_id="$(gh run list --repo "$REPO" --workflow ci.yml --branch "$head" --limit 20 \
                --json databaseId,headSha,event | \
                jq -r --arg sha "$sha" '.[] | select(.headSha == $sha and .event == "workflow_dispatch") | .databaseId' | head -n1)"
              [[ -n "$run_id" ]] && break
              sleep 4
            done
          fi
          test -n "$run_id"
          gh run watch "$run_id" --repo "$REPO" --exit-status

          is_draft="$(gh pr view "$pr" --repo "$REPO" --json isDraft --jq '.isDraft')"
          if [[ "$is_draft" == "true" ]]; then
            gh pr ready "$pr" --repo "$REPO"
          fi

          mergeable=""
          for _ in $(seq 1 20); do
            mergeable="$(gh pr view "$pr" --repo "$REPO" --json mergeable --jq '.mergeable')"
            [[ "$mergeable" == "MERGEABLE" ]] && break
            [[ "$mergeable" == "CONFLICTING" ]] && break
            sleep 3
          done
          [[ "$mergeable" == "MERGEABLE" ]]

          review_decision="$(gh pr view "$pr" --repo "$REPO" --json reviewDecision --jq '.reviewDecision // ""')"
          blocking_review_count="$(gh api --paginate "repos/$REPO/pulls/$pr/reviews?per_page=100" | \
            jq -s --arg sha "$sha" '[.[][] | select(.state == "CHANGES_REQUESTED" and .commit_id == $sha)] | length')"
          if [[ "$review_decision" == "CHANGES_REQUESTED" && "$blocking_review_count" -gt 0 ]]; then
            echo "PR #$pr has current-head requested changes; handing it to bounded native review repair."
            echo "repair_needed=true" >> "$GITHUB_OUTPUT"
            echo "pr=$pr" >> "$GITHUB_OUTPUT"
            echo "head=$head" >> "$GITHUB_OUTPUT"
            echo "issue=$linked_issue" >> "$GITHUB_OUTPUT"
            echo "recovered=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$review_decision" == "CHANGES_REQUESTED" && "$blocking_review_count" -eq 0 ]]; then
            echo "PR #$pr has only stale CHANGES_REQUESTED reviews from an older head; leaving it for fresh Review Gate evaluation."
            echo "recovered=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Recovery uses the same autonomous approval rule as the normal
          # merge path: green exact-head workflow_dispatch CI is authoritative.
          # Only a current-head CHANGES_REQUESTED review blocks recovery.
          echo "PR #$pr passed recovery approval: exact-head CI is green and no current-head blocking review exists."

          gh pr merge "$pr" --repo "$REPO" --merge --delete-branch
          git fetch origin main development
          main_sha="$(git rev-parse origin/main)"

          gh workflow run ci.yml --repo "$REPO" --ref main
          main_run=""
          for _ in $(seq 1 30); do
            main_run="$(gh run list --repo "$REPO" --workflow ci.yml --branch main --limit 20 \
              --json databaseId,headSha,event | \
              jq -r --arg sha "$main_sha" '.[] | select(.headSha == $sha and .event == "workflow_dispatch") | .databaseId' | head -n1)"
            [[ -n "$main_run" ]] && break
            sleep 4
          done
          test -n "$main_run"
          gh run watch "$main_run" --repo "$REPO" --exit-status

          git fetch origin main development
          git merge-base --is-ancestor origin/development origin/main
          git push origin "refs/remotes/origin/main:refs/heads/development"

          gh workflow run ci.yml --repo "$REPO" --ref development
          dev_run=""
          for _ in $(seq 1 30); do
            dev_run="$(gh run list --repo "$REPO" --workflow ci.yml --branch development --limit 20 \
              --json databaseId,headSha,event | \
              jq -r --arg sha "$main_sha" '.[] | select(.headSha == $sha and .event == "workflow_dispatch") | .databaseId' | head -n1)"
            [[ -n "$dev_run" ]] && break
            sleep 4
          done
          test -n "$dev_run"
          gh run watch "$dev_run" --repo "$REPO" --exit-status

          linked_issue="$(gh pr view "$pr" --repo "$REPO" --json body --jq '.body' | grep -oE 'Closes #[0-9]+' | head -n1 | grep -oE '[0-9]+' || true)"
          if [[ -n "$linked_issue" ]]; then
            issue_state="$(gh issue view "$linked_issue" --repo "$REPO" --json state --jq '.state')"
            if [[ "$issue_state" == "OPEN" ]]; then
              gh issue close "$linked_issue" --repo "$REPO" --reason completed
            fi
          fi

          echo "recovered=true" >> "$GITHUB_OUTPUT"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"

      - name: Reconcile development after external merge
        if: steps.lease.outputs.acquired == 'true' && steps.recover.outputs.recovered != 'true' && steps.recover.outputs.repair_needed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main development
          main_sha="$(git rev-parse origin/main)"
          dev_sha="$(git rev-parse origin/development)"

          [[ "$main_sha" != "$dev_sha" ]] || exit 0
          git merge-base --is-ancestor origin/development origin/main || {
            echo "development is not an ancestor of main; refusing non-fast-forward reconciliation." >&2
            exit 1
          }

          gh workflow run ci.yml --repo "$REPO" --ref main
          main_run=""
          for _ in $(seq 1 30); do
            main_run="$(gh run list --repo "$REPO" --workflow ci.yml --branch main --event workflow_dispatch --limit 20 \
              --json databaseId,headSha | jq -r --arg sha "$main_sha" '.[] | select(.headSha == $sha) | .databaseId' | head -n1)"
            [[ -n "$main_run" ]] && break
            sleep 4
          done
          test -n "$main_run"
          gh run watch "$main_run" --repo "$REPO" --exit-status

          git push origin "refs/remotes/origin/main:refs/heads/development"

          gh workflow run ci.yml --repo "$REPO" --ref development
          dev_run=""
          for _ in $(seq 1 30); do
            dev_run="$(gh run list --repo "$REPO" --workflow ci.yml --branch development --event workflow_dispatch --limit 20 \
              --json databaseId,headSha | jq -r --arg sha "$main_sha" '.[] | select(.headSha == $sha) | .databaseId' | head -n1)"
            [[ -n "$dev_run" ]] && break
            sleep 4
          done
          test -n "$dev_run"
          gh run watch "$dev_run" --repo "$REPO" --exit-status
          echo "development reconciled to main $main_sha with explicit CI on both branches."
      - name: Hold blocking review for external coding provider
        id: reviewrepair
        if: steps.lease.outputs.acquired == 'true' && steps.recover.outputs.repair_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "Blocking review requires source changes; leaving the PR for the configured external coding executor."
          echo "The existing PR is left untouched so the external executor can repair the exact head."

      - name: Verify previous GitHub cycle is complete
        id: previous
        if: steps.lease.outputs.acquired == 'true' && steps.recover.outputs.recovered != 'true'
        shell: bash
        run: |
          set -euo pipefail

          # Product work is single-slice. An existing automation PR or another
          # live GitHub execution must complete before a new canonical card is
          # selected.
          prs="$(gh pr list --repo "$REPO" --state open --limit 100             --json headRefName,baseRefName |             jq '[.[] | select((.headRefName | (startswith("automation/") or startswith("chatgpt/"))) or .headRefName == "development")] | length')"
          runs="$(gh run list --repo "$REPO" --limit 100             --json databaseId,status |             jq --argjson current "$GITHUB_RUN_ID"               '[.[] | select((.status == "queued" or .status == "in_progress") and .databaseId != $current)] | length')"

          # Pre-manifest bot-created Issues are durable legacy recovery state.
          # Canonical Release A tracker Issues always start with an approved
          # stable key and are handled by the dependency selector below.
          legacy_open="$(gh api --paginate "repos/$REPO/issues?state=open&sort=created&direction=asc&per_page=100" |             jq -s '[.[][] | select((has("pull_request") | not) and .user.login == "github-actions[bot]") |               select((.title | test("^\\[(A[0-9]+-[0-9]+|RA-GATE-[0-9]+)\\] ")) | not)] | length')"

          if [[ "$prs" -gt 0 || "$runs" -gt 0 || "$legacy_open" -gt 0 ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Previous GitHub cycle is incomplete: open_prs=$prs active_runs=$runs legacy_open=$legacy_open"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate approved Release A backlog graph
        if: steps.lease.outputs.acquired == 'true' && steps.previous.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/release_a_backlog.py validate

      - name: Select deterministic READY Release A card
        id: plan
        if: steps.lease.outputs.acquired == 'true' && steps.previous.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail

          # Import completion is a hard activation gate. Until all 101 approved
          # cards are present in GitHub, do not create or invent replacement
          # scope.
          if [[ ! -f .automation/backlog/release-a/import.complete ]]; then
            echo "Canonical Release A tracker import is not complete; no product slice may start."
            exit 0
          fi

          gh api --paginate "repos/$REPO/issues?state=all&per_page=100" |             jq -s 'add | map(select(has("pull_request") | not))'             > /tmp/release-a-issues.json

          selection="$(python .github/scripts/release_a_backlog.py select             --issues /tmp/release-a-issues.json)"
          ready="$(jq -r '.ready' <<<"$selection")"

          if [[ "$ready" != "true" ]]; then
            complete="$(jq -r '.implementation_complete // false' <<<"$selection")"
            if [[ "$complete" == "true" ]]; then
              echo "All 86 Release A implementation cards are DONE; product executor is waiting for Release A gates."
            else
              echo "No dependency-ready Release A implementation card is available."
            fi
            exit 0
          fi

          issue="$(jq -r '.issue' <<<"$selection")"
          key="$(jq -r '.key' <<<"$selection")"
          title="$(jq -r '.title' <<<"$selection")"

          gh issue view "$issue" --repo "$REPO" --json body --jq '.body' > /tmp/aidi-plan.md
          test -s /tmp/aidi-plan.md

          echo "issue=$issue" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "Selected canonical READY card $key as GitHub Issue #$issue."

      - name: Check coding provider
        id: executor
        if: steps.plan.outputs.issue != ''
        shell: bash
        run: |
          set -euo pipefail
          config=".automation/coding-provider.json"
          test -f "$config"
          provider="$(jq -r '.provider // "disabled"' "$config")"
          enabled="$(jq -r '.enabled // false' "$config")"

          echo "provider=$provider" >> "$GITHUB_OUTPUT"
          if [[ "$enabled" != "true" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Coding provider is disabled. The selected Release A card remains open; no branch, source change, or PR will be created."
            exit 0
          fi

          if [[ "$provider" == "chatgpt-connector" ]]; then
            handoff_path="$(jq -r '.handoff_path // ".automation/selected-card.json"' "$config")"
            issue="${{ steps.plan.outputs.issue }}"
            key="${{ steps.plan.outputs.key }}"
            title="${{ steps.plan.outputs.title }}"
            main_sha="$(git rev-parse HEAD)"
            handoff="$(jq -n \
              --arg issue "$issue" \
              --arg key "$key" \
              --arg title "$title" \
              --arg main_sha "$main_sha" \
              --arg selected_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{issue:($issue|tonumber),stable_key:$key,title:$title,main_sha:$main_sha,selected_at:$selected_at,executor:"chatgpt-connector"}')"
            encoded="$(printf '%s\n' "$handoff" | base64 -w0)"
            current_sha="$(gh api "repos/$REPO/contents/$handoff_path?ref=automation-control" --jq '.sha' 2>/dev/null || true)"
            if [[ -n "$current_sha" ]]; then
              gh api --method PUT "repos/$REPO/contents/$handoff_path" \
                -f message="chore(automation): publish external executor handoff $key" \
                -f content="$encoded" -f sha="$current_sha" -f branch="automation-control" >/dev/null
            else
              gh api --method PUT "repos/$REPO/contents/$handoff_path" \
                -f message="chore(automation): publish external executor handoff $key" \
                -f content="$encoded" -f branch="automation-control" >/dev/null
            fi
            echo "external=true" >> "$GITHUB_OUTPUT"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Published canonical $key / Issue #$issue for isolated ChatGPT connector execution."
            exit 0
          fi

          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "Provider '$provider' is enabled in configuration but no executor adapter is installed in this workflow." >&2
          exit 1
      - name: Create isolated automation branch
        if: steps.executor.outputs.ready == 'true'
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          issue="${{ steps.plan.outputs.issue }}"
          branch="automation/core-${issue}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch" origin/main
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Deterministic pre-PR checks
        if: steps.executor.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          go mod verify
          go vet ./...
          go test -race ./...
          python -m compileall -q workers/src workers/tests
          PYTHONPATH=workers/src python -m unittest discover -s workers/tests -v
          (
            cd web
            npm ci --ignore-scripts --no-audit --no-fund
            npm run build
          )
          rm -f web/tsconfig.tsbuildinfo

          test -n "$(git status --porcelain)"

      - name: Commit and push automation branch
        if: steps.executor.outputs.ready == 'true'
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "feat(release-a): autonomous foundation slice (#${{ steps.plan.outputs.issue }})"
          git push origin "HEAD:${{ steps.branch.outputs.name }}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open draft PR
        if: steps.commit.outputs.sha != ''
        id: pr
        shell: bash
        env:
          PR_TITLE: ${{ steps.plan.outputs.title }}
        run: |
          set -euo pipefail
          issue="${{ steps.plan.outputs.issue }}"
          if ! pr_url="$(gh pr create --repo "$REPO" --draft --base main             --head "${{ steps.branch.outputs.name }}"             --title "$PR_TITLE"             --body "Automated GitHub-only Release A slice.

          Closes #$issue

          Execution: GitHub-hosted runner only. Full CI is explicitly dispatched and awaited before merge.")"; then
            gh issue comment "$issue" --repo "$REPO" --body "Automation blocked at PR creation. No new Release A slice should be selected until this issue is recovered or closed." || true
            exit 1
          fi
          echo "number=${pr_url##*/}" >> "$GITHUB_OUTPUT"

      - name: Dispatch full CI, repair once, and await green
        if: steps.pr.outputs.number != ''
        id: ci
        shell: bash
        run: |
          set -euo pipefail
          branch="${{ steps.branch.outputs.name }}"
          sha="${{ steps.commit.outputs.sha }}"
          issue="${{ steps.plan.outputs.issue }}"

          dispatch_and_wait() {
            local target_sha="$1"
            gh workflow run ci.yml --repo "$REPO" --ref "$branch"

            RUN_ID=""
            for _ in $(seq 1 30); do
              RUN_ID="$(gh run list --repo "$REPO" --workflow ci.yml --branch "$branch"                 --event workflow_dispatch --limit 10 --json databaseId,headSha |                 jq -r --arg sha "$target_sha" '.[] | select(.headSha == $sha) | .databaseId' | head -n1)"
              [[ -n "$RUN_ID" ]] && break
              sleep 4
            done
            test -n "$RUN_ID"

            set +e
            gh run watch "$RUN_ID" --repo "$REPO" --exit-status
            WATCH_STATUS=$?
            set -e
          }

          dispatch_and_wait "$sha"

          if [[ "$WATCH_STATUS" -ne 0 ]]; then
            gh run view "$RUN_ID" --repo "$REPO" --log-failed > /tmp/aidi-ci-failed.log || true
            echo "Exact-head CI failed. No coding provider is configured, so autonomous source repair is disabled." >&2
            exit 1
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Mark PR ready and verify mergeability
        if: steps.ci.outputs.run_id != ''
        id: mergecheck
        shell: bash
        run: |
          set -euo pipefail
          pr="${{ steps.pr.outputs.number }}"
          ci_run="${{ steps.ci.outputs.run_id }}"
          gh pr ready "$pr" --repo "$REPO"

          # The authoritative gate for this native cycle is the exact-head-SHA
          # workflow_dispatch CI that was explicitly awaited above. A duplicate
          # pull_request run created by GITHUB_TOKEN can remain action_required
          # and make mergeStateStatus=UNSTABLE even when the exact-SHA CI is green.
          ci_conclusion="$(gh run view "$ci_run" --repo "$REPO" --json conclusion --jq '.conclusion')"
          [[ "$ci_conclusion" == "success" ]] || {
            echo "Authoritative exact-SHA CI is not green: $ci_conclusion" >&2
            exit 1
          }

          # Autonomous self-approval gate. GitHub does not allow the PR
          # author to approve its own PR, so the authoritative exact-head
          # workflow_dispatch CI above acts as the executor approval. A current-
          # head CHANGES_REQUESTED review remains a hard block.
          blocking_review_count="$(gh api --paginate "repos/$REPO/pulls/$pr/reviews?per_page=100" | \
            jq -s --arg sha "${{ steps.ci.outputs.sha }}" '[.[][] | select(.state == "CHANGES_REQUESTED" and .commit_id == $sha)] | length')"
          if [[ "$blocking_review_count" -gt 0 ]]; then
            echo "PR #$pr has current-head CHANGES_REQUESTED; autonomous approval refuses merge."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "PR #$pr passed autonomous approval: exact-head CI is green and no current-head blocking review exists."

          mergeable=""
          for _ in $(seq 1 20); do
            mergeable="$(gh pr view "$pr" --repo "$REPO" --json mergeable --jq '.mergeable')"
            [[ "$mergeable" == "MERGEABLE" ]] && break
            [[ "$mergeable" == "CONFLICTING" ]] && {
              echo "PR has merge conflicts." >&2
              exit 1
            }
            sleep 3
          done
          [[ "$mergeable" == "MERGEABLE" ]] || {
            echo "PR mergeability did not become MERGEABLE: $mergeable" >&2
            exit 1
          }
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Merge green PR
        if: steps.mergecheck.outputs.ready == 'true'
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          pr="${{ steps.pr.outputs.number }}"
          gh pr merge "$pr" --repo "$REPO" --merge --delete-branch
          git fetch origin main
          echo "main_sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"

      - name: Validate merged main with explicit CI
        if: steps.merge.outputs.main_sha != ''
        id: mainci
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ steps.merge.outputs.main_sha }}"
          gh workflow run ci.yml --repo "$REPO" --ref main
          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(gh run list --repo "$REPO" --workflow ci.yml --branch main               --event workflow_dispatch --limit 10 --json databaseId,headSha |               jq -r --arg sha "$sha" '.[] | select(.headSha == $sha) | .databaseId' | head -n1)"
            [[ -n "$run_id" ]] && break
            sleep 4
          done
          test -n "$run_id"
          gh run watch "$run_id" --repo "$REPO" --exit-status
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Fast-forward development and validate it
        if: steps.mainci.outputs.run_id != ''
        id: devci
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main development
          git merge-base --is-ancestor origin/development origin/main
          git push origin "refs/remotes/origin/main:refs/heads/development"

          sha="${{ steps.merge.outputs.main_sha }}"
          gh workflow run ci.yml --repo "$REPO" --ref development
          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(gh run list --repo "$REPO" --workflow ci.yml --branch development               --event workflow_dispatch --limit 10 --json databaseId,headSha |               jq -r --arg sha "$sha" '.[] | select(.headSha == $sha) | .databaseId' | head -n1)"
            [[ -n "$run_id" ]] && break
            sleep 4
          done
          test -n "$run_id"
          gh run watch "$run_id" --repo "$REPO" --exit-status
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

          issue="${{ steps.plan.outputs.issue }}"
          if [[ -n "$issue" ]]; then
            issue_state="$(gh issue view "$issue" --repo "$REPO" --json state --jq '.state')"
            if [[ "$issue_state" == "OPEN" ]]; then
              gh issue close "$issue" --repo "$REPO" --reason completed
            fi
          fi

      - name: Release lease
        if: always() && steps.lease.outputs.acquired == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if ! lease_json="$(gh api "repos/$REPO/contents/.automation/lease.active?ref=automation-control" 2>/dev/null)"; then
            exit 0
          fi
          lease_sha="$(jq -r '.sha' <<<"$lease_json")"
          lease_content="$(jq -r '.content' <<<"$lease_json" | base64 -d)"
          owner="$(jq -r '.owner // empty' <<<"$lease_content")"
          [[ "$owner" == "$LEASE_OWNER" ]] || exit 0

          # Completion evidence is append-only; the mutex itself is deleted.
          if [[ "${{ job.status }}" == "success" && -n "${{ steps.devci.outputs.run_id }}" ]]; then
            completed="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            history_path=".automation/history/${GITHUB_RUN_ID}.json"
            history="$(jq -n \
              --arg owner "$LEASE_OWNER" \
              --arg completed "$completed" \
              --argjson issue "${{ steps.plan.outputs.issue || '0' }}" \
              --argjson pr "${{ steps.pr.outputs.number || '0' }}" \
              --arg main_sha "${{ steps.merge.outputs.main_sha }}" \
              --argjson pr_ci "${{ steps.ci.outputs.run_id || '0' }}" \
              --argjson main_ci "${{ steps.mainci.outputs.run_id || '0' }}" \
              --argjson dev_ci "${{ steps.devci.outputs.run_id || '0' }}" \
              '{owner:$owner,completed_at:$completed,issue:$issue,pull_request:$pr,main_sha:$main_sha,ci:{pull_request_run:$pr_ci,main_push_run:$main_ci,development_push_run:$dev_ci}}')"
            history_encoded="$(printf '%s\n' "$history" | base64 -w0)"
            gh api --method PUT "repos/$REPO/contents/$history_path" \
              -f message="chore(automation): record completed cycle $GITHUB_RUN_ID" \
              -f content="$history_encoded" \
              -f branch="automation-control" >/dev/null
          fi

          gh api --method DELETE "repos/$REPO/contents/.automation/lease.active" \
            -f message="chore(automation): release $LEASE_OWNER lease" \
            -f sha="$lease_sha" \
            -f branch="automation-control" >/dev/null


      - name: Queue next autonomous cycle
        if: success() && steps.lease.outputs.acquired == 'true'
        shell: bash
        env:
          RECOVERED: ${{ steps.recover.outputs.recovered }}
          DEV_CI_RUN: ${{ steps.devci.outputs.run_id }}
        run: |
          set -euo pipefail

          progressed=false
          if [[ "$RECOVERED" == "true" || -n "$DEV_CI_RUN" ]]; then
            progressed=true
          fi
          [[ "$progressed" == "true" ]] || exit 0

          open_prs="$(gh pr list --repo "$REPO" --state open --limit 100 --json headRefName | \
            jq '[.[] | select(.headRefName | (startswith("automation/") or startswith("chatgpt/")))] | length')"
          if [[ "$open_prs" -gt 0 ]]; then
            echo "Next cycle not queued: open automation PRs=$open_prs"
            exit 0
          fi

          if gh api "repos/$REPO/contents/.automation/lease.active?ref=automation-control" >/dev/null 2>&1; then
            echo "Next cycle not queued because lease.active still exists."
            exit 0
          fi

          # Concurrency serializes the hand-off: the next run may be queued now,
          # but cannot execute until this run has fully completed.
          gh workflow run autonomous-core.yml --repo "$REPO" --ref main
          echo "Queued next Autonomous Core cycle via workflow_dispatch."

      - name: Queue GitHub Doctor after failed cycle
        if: failure() && steps.lease.outputs.acquired == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run github-doctor.yml --repo "$REPO" --ref main
          echo "Queued GitHub Doctor via workflow_dispatch."
