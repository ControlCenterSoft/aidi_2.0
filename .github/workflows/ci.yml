name: AIDI CI

on:
  workflow_dispatch:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    if: github.event_name != 'pull_request' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Module integrity
        run: go mod verify
      - name: Static analysis
        run: go vet ./...
      - name: Compile packages
        run: go build ./...
      - name: Unit tests
        run: go test -race -coverprofile=coverage.out ./...
      - name: Minimal Release A command entry points
        run: |
          go build -trimpath -o /tmp/aidi-control ./cmd/aidi-control
          go build -trimpath -o /tmp/aidi-node-agent ./cmd/aidi-node-agent
          go build -trimpath -o /tmp/aidi-installer ./cmd/aidi-installer
          go build -trimpath -o /tmp/aidi-admin ./cmd/aidi-admin
      - name: Release provenance metadata
        shell: bash
        run: |
          set -euo pipefail
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          provenance="github:$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID@$GITHUB_SHA"
          make release \
            RELEASE_VERSION=ci \
            RELEASE_COMMIT="$GITHUB_SHA" \
            RELEASE_BUILD_TIME="$build_time" \
            RELEASE_PROVENANCE="$provenance"
          for name in aidi-control aidi-node-agent aidi-installer aidi-admin; do
            metadata="$(dist/release/ci/$name --version)"
            printf '%s\n' "$metadata" | grep -F "\"version\":\"ci\""
            printf '%s\n' "$metadata" | grep -F "\"commit\":\"$GITHUB_SHA\""
            printf '%s\n' "$metadata" | grep -F "\"build_time\":\"$build_time\""
            printf '%s\n' "$metadata" | grep -F "\"provenance\":\"$provenance\""
          done
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          provenance="github:$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID@$GITHUB_SHA"
          go build -trimpath -ldflags "-X main.version=ci -X main.commit=$GITHUB_SHA -X main.buildTime=$build_time -X main.provenance=$provenance" -o dist/aidi ./cmd/aidi
          metadata="$(dist/aidi --version)"
          printf '%s\n' "$metadata" | grep -F "\"version\":\"ci\""
          printf '%s\n' "$metadata" | grep -F "\"commit\":\"$GITHUB_SHA\""
          printf '%s\n' "$metadata" | grep -F "\"build_time\":\"$build_time\""
          printf '%s\n' "$metadata" | grep -F "\"provenance\":\"$provenance\""
          sha256sum dist/aidi > dist/aidi.sha256
      - name: Export qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: aidi-core
          path: |
            dist/aidi
            dist/aidi.sha256
            dist/release/ci
            coverage.out
          if-no-files-found: error

  python:
    if: github.event_name != 'pull_request' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify CI quality-gate contract
        run: python .github/scripts/test_ci_quality_gates.py
      - name: Validate approved monorepo structure
        run: python .github/scripts/test_monorepo_structure.py
      - name: Validate approved Release A backlog graph
        run: python .github/scripts/release_a_backlog.py validate
      - name: Test GitHub-only Release A selector
        run: python .github/scripts/test_release_a_backlog.py
      - name: Compile
        run: python -m compileall -q workers/src workers/tests
      - name: Worker smoke test
        run: PYTHONPATH=workers/src python -c "from aidi_worker import health; assert health()['status'] == 'ok'"
      - name: Worker contract unit tests
        run: PYTHONPATH=workers/src python -m unittest discover -s workers/tests -v

  web:
    if: github.event_name != 'pull_request' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install from pinned lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Export pinned lockfile
        uses: actions/upload-artifact@v4
        with:
          name: web-lockfile
          path: web/package-lock.json
          if-no-files-found: error
